<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="utf-8">
  <title>Acme Training Portal</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 2rem;
      background: #f6f7f8;
      color: #202124;
    }

    main {
      max-width: 980px;
      margin: 0 auto;
    }

    section,
    table {
      background: #fff;
      border: 1px solid #d7dbe0;
      border-radius: 6px;
      padding: 1rem;
      margin-bottom: 1rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      padding: 0;
    }

    th,
    td {
      padding: .75rem;
      border-bottom: 1px solid #e5e7eb;
      text-align: left;
    }

    input,
    textarea,
    button {
      font: inherit;
      padding: .5rem;
      margin: .2rem 0;
    }

    input,
    textarea {
      width: 100%;
      box-sizing: border-box;
    }
  </style>
</head>

<body>
  <main>
    <h1>Acme Training Portal</h1>
    <section>
      <form method="get" action="/">
        <label>Tenant <input name="tenant" th:value="${tenant}"></label>
        <label>Search <input name="q" th:value="${query}" placeholder="course or instructor"></label>
        <button type="submit">Search</button>
      </form>
    </section>
    <table>
      <thead>
        <tr>
          <th>Course</th>
          <th>Instructor</th>
          <th>Tenant</th>
          <th>Published</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="course : ${courses}">
          <td><a th:href="@{/courses/{id}(id=${course.id})}" th:text="${course.title}"></a></td>
          <td th:text="${course.instructor}"></td>
          <td th:text="${course.tenant}"></td>
          <td th:text="${course.published}"></td>
        </tr>
      </tbody>
    </table>
    <section>
      <h2>Admin Tools</h2>
      <p><a href="/documents">List documents</a></p>
      <p><a href="/download?file=onboarding.txt">Download onboarding document</a></p>
      <p>Support token: <code th:text="${supportToken}"></code></p>
      <form action="/imports/preview" method="post">
        <textarea name="xml"
          rows="4">&lt;course&gt;&lt;title&gt;Imported Security Training&lt;/title&gt;&lt;/course&gt;</textarea>
        <button type="submit">Preview XML import</button>
      </form>
    </section>
  </main>
</body>

</html>
